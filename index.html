<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Calculator</title>
    <link href="./src/output.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-gray-900 to-gray-800 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-gray-800 p-6 rounded-3xl shadow-2xl w-full max-w-sm border border-gray-700">
        
        <div class="bg-gray-900 rounded-2xl p-4 mb-6 text-right overflow-hidden border border-gray-700">
            <div id="history" class="text-gray-400 text-sm h-5 tracking-wider font-mono"></div>
            <div id="display" class="text-white text-4xl font-bold tracking-wider font-mono truncate">0</div>
        </div>

        <div class="grid grid-cols-4 gap-3">
            <button onmousedown="triggerButtonAnimation(this)" onclick="clearAll()" class="calc-btn bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white col-span-2">AC</button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="deleteLast()" class="calc-btn bg-gray-700 text-white hover:bg-gray-600"><i class="fa-solid fa-delete-left"></i></button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="appendOperator('/')" class="calc-btn bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500 hover:text-white">÷</button>

            <button onmousedown="triggerButtonAnimation(this)" onclick="appendNumber('7')" class="calc-btn bg-gray-700 text-white hover:bg-gray-600">7</button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="appendNumber('8')" class="calc-btn bg-gray-700 text-white hover:bg-gray-600">8</button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="appendNumber('9')" class="calc-btn bg-gray-700 text-white hover:bg-gray-600">9</button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="appendOperator('*')" class="calc-btn bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500 hover:text-white">×</button>

            <button onmousedown="triggerButtonAnimation(this)" onclick="appendNumber('4')" class="calc-btn bg-gray-700 text-white hover:bg-gray-600">4</button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="appendNumber('5')" class="calc-btn bg-gray-700 text-white hover:bg-gray-600">5</button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="appendNumber('6')" class="calc-btn bg-gray-700 text-white hover:bg-gray-600">6</button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="appendOperator('-')" class="calc-btn bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500 hover:text-white">-</button>

            <button onmousedown="triggerButtonAnimation(this)" onclick="appendNumber('1')" class="calc-btn bg-gray-700 text-white hover:bg-gray-600">1</button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="appendNumber('2')" class="calc-btn bg-gray-700 text-white hover:bg-gray-600">2</button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="appendNumber('3')" class="calc-btn bg-gray-700 text-white hover:bg-gray-600">3</button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="appendOperator('+')" class="calc-btn bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500 hover:text-white">+</button>

            <button onmousedown="triggerButtonAnimation(this)" onclick="appendNumber('0')" class="calc-btn bg-gray-700 text-white hover:bg-gray-600 col-span-2">0</button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="appendNumber('.')" class="calc-btn bg-gray-700 text-white hover:bg-gray-600">.</button>
            <button onmousedown="triggerButtonAnimation(this)" onclick="calculateResult()" class="calc-btn bg-indigo-600 text-white hover:bg-indigo-500 shadow-lg shadow-indigo-500/30">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
